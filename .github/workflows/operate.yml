name: Reusable fixed PaaS operations
on:
  workflow_call:
    inputs:
      deployment-url: {required: false, type: string, default: https://deploy.ryanl.in}
      action: {required: true, type: string}
      release-id: {required: false, type: string, default: ''}
      service: {required: false, type: string, default: web}
      image: {required: false, type: string, default: ''}
      backup-id: {required: false, type: string, default: ''}
      confirm: {required: false, type: string, default: ''}
      domain: {required: false, type: string, default: ''}
permissions: {}
jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Execute fixed operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAAS_MODE: operation
          PAAS_URL: ${{ inputs.deployment-url }}
          OP_ACTION: ${{ inputs.action }}
          OP_RELEASE: ${{ inputs.release-id }}
          OP_SERVICE: ${{ inputs.service }}
          OP_IMAGE: ${{ inputs.image }}
          OP_BACKUP: ${{ inputs.backup-id }}
          OP_CONFIRM: ${{ inputs.confirm }}
          OP_DOMAIN: ${{ inputs.domain }}
        run: |
          python3 - <<'PY'
          """This code is embedded in trusted reusable workflow steps, not fetched from the app."""
          import json, os, time, urllib.request, urllib.error, pathlib, sys, urllib.parse
          BASE=os.environ.get('PAAS_URL','https://deploy.ryanl.in')
          origin=urllib.parse.urlsplit(BASE)
          if origin.scheme!='https' or not origin.hostname or origin.username or origin.password or origin.port or origin.path or origin.query or origin.fragment:
              raise ValueError('deployment URL must be an HTTPS origin')
          class TransientRequestError(RuntimeError):pass
          def request(url,method='GET',body=None,token=None,binary=False,read_token=None):
              headers={'Accept':'application/json','User-Agent':'Ryanl-Personal-PaaS/1.0 (+https://github.com/Deploy-ryanl-in/personal-paas)'}
              if token: headers['Authorization']='Bearer '+token
              if read_token:headers['X-GitHub-Read-Token']=read_token
              if body is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: return r.read() if binary else json.load(r)
              except urllib.error.HTTPError as e:
                  detail=e.read(2048).decode(errors='replace')
                  error=TransientRequestError if e.code in [429,502,503,504] else RuntimeError
                  raise error('API HTTP '+str(e.code)+': '+detail) from None
              except (urllib.error.URLError,TimeoutError) as e:
                  raise TransientRequestError('API temporarily unreachable') from None
          def oidc():
              url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(BASE,safe='')
              return request(url,token=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'])['value']
          def api(path,method='GET',body=None,binary=False):
              for attempt in range(6):
                  try:return request(BASE+'/v1/'+path,method,body,oidc(),binary,os.environ.get('GH_TOKEN'))
                  except TransientRequestError:
                      if attempt==5:raise
                      time.sleep(min(2**attempt,10))
              raise RuntimeError('API retry limit exceeded')
          def poll(job):
              for _ in range(240):
                  state=api('deployments/'+job['id'])
                  if state['status'] in ['failed','superseded']: raise RuntimeError(state.get('error','deployment failed'))
                  if state['status']=='succeeded':
                      runtime=api('status');release=runtime.get('release',state['release']);action=state.get('operation',{}).get('action','deploy')
                      with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                          f.write('Operation: `'+action+'`\n\nState: `'+runtime['state']+'`\n\nCommit: `'+release['commit']+'`\n\nRelease: `'+release['id']+'`\n\n')
                          if action=='stop':f.write('Containers stopped; identities and persistent volumes retained.\n')
                          if action=='delete':f.write('Containers and routes deleted; persistent volumes and recorded release retained. Use start to recreate.\n')
                          if action=='cleanup-images':f.write('Unused local application images cleaned. Images used by running or stopped containers, data volumes and remote GHCR packages retained.\n')
                          if runtime['state']=='active':
                              for domain in sorted({s['domain'] for s in release['config']['services'].values() if s['type']=='web'}):f.write('- https://'+domain+'\n')
                      shared_summary()
                      return state
                  time.sleep(5)
              raise RuntimeError('deployment deadline exceeded')
          def shared_summary():
              members=api('routes');groups={}
              for member in members:groups.setdefault(member['domain'],[]).append(member)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  for domain,items in groups.items():
                      if len(items)<2:continue
                      f.write('\n> Shared domain **'+domain+'** also belongs to these services:\n\n')
                      for member in items:
                          paths=(member.get('routing') or {}).get('paths') or ['all paths']
                          f.write('- `'+(member['repository'] or str(member['repositoryId']))+'/'+member['service']+'`: '+', '.join('`'+p+'`' for p in paths)+' ('+('active' if member['active'] else 'inactive')+')\n')
                      print('::warning title=Shared domain::'+domain+' is shared by '+', '.join((m['repository'] or str(m['repositoryId']))+'/'+m['service'] for m in items))
          def unique(pairs):
              result={}
              for k,v in pairs:
                  if k in result:raise ValueError('duplicate manifest key')
                  result[k]=v
              return result
          if os.environ['PAAS_MODE']=='deploy':
              repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA']
              manifest=request('https://api.github.com/repos/'+repo+'/contents/paas.json?ref='+sha,token=os.environ['GH_TOKEN'])
              import base64
              config=json.loads(base64.b64decode(manifest['content']),object_pairs_hook=unique)
              supplied=json.loads(os.environ.get('PAAS_SECRETS') or '{}',object_pairs_hook=unique)
              wanted={ref for s in config['services'].values() for ref in s.get('secretRefs',{}).values()} if config['state']=='present' else set()
              selected={ref:supplied[ref] for ref in wanted}
              for value in selected.values():
                  if not isinstance(value,str) or '\n' in value or '\r' in value:raise ValueError('secrets must be single-line strings')
                  print('::add-mask::'+value)
              images={}
              for file in pathlib.Path('images').glob('*.json'):
                  value=json.loads(file.read_text());images[value['service']]=value['image']+'@'+value['digest']
              poll(api('deployments','POST',{'images':images,'secrets':selected}))
          else:
              action=os.environ['OP_ACTION']
              if action in ['clear-route-cache','route-cache']:
                  if action=='clear-route-cache' and os.environ.get('GITHUB_EVENT_NAME')=='push':
                      repository=request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY'],token=os.environ['GH_TOKEN'])
                      import base64
                      try:
                          declaration=request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/paas.json?ref='+urllib.parse.quote(repository['default_branch'],safe=''),token=os.environ['GH_TOKEN'])
                          config=json.loads(base64.b64decode(declaration['content']),object_pairs_hook=unique)
                      except TransientRequestError:raise
                      except (RuntimeError,ValueError,KeyError):config={}
                      if config.get('deployBranch') and os.environ['GITHUB_REF']!='refs/heads/'+config['deployBranch']:
                          print('No cache invalidation for a non-deployment branch')
                          sys.exit(0)
                  result=api('route-cache/clear','POST',{'domain':os.environ.get('OP_DOMAIN','')}) if action=='clear-route-cache' else api('route-cache')
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                      f.write('Route cache operation: `'+action+'`\n\nCleared entries: `'+str(result['clearedEntries'])+'`\n\n')
                      for domain,count in result['entries'].items():f.write('- `'+domain+'`: '+str(count)+' cached paths\n')
                  if result.get('warning'):print('::warning title=Route cache::'+result['warning'])
                  print(json.dumps(result,indent=2))
              elif action in ['status','routes','history','backups','logs']:
                  route=action
                  if action=='logs':
                      import urllib.parse
                      route+='?service='+urllib.parse.quote(os.environ['OP_SERVICE'])
                  print(json.dumps(api(route),indent=2))
                  if action in ['status','routes']:shared_summary()
              elif action=='download-backup':
                  import urllib.parse
                  data=api('backups/'+urllib.parse.quote(os.environ['OP_BACKUP'],safe=''),binary=True)
                  pathlib.Path('backup.tar.age').write_bytes(data)
              else:
                  body={'action':action}
                  for env,key in [('OP_RELEASE','releaseId'),('OP_SERVICE','service'),('OP_IMAGE','image'),('OP_BACKUP','backupId'),('OP_CONFIRM','confirm')]:
                      if os.environ.get(env):body[key]=os.environ[env]
                  print(json.dumps(poll(api('operations','POST',body)),indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.action == 'download-backup'
        with:
          name: encrypted-backup
          path: backup.tar.age
          retention-days: 1
